<!-- Only keep email, username, password fields -->
<form class="auth-form" action="#" method="POST">
    <h2>Sign Up</h2>
    <div class="input-group">
        <label for="email">📧 Email / Gmail</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
    </div>
    <div class="input-group">
        <label for="username">👤 Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
    </div>
    <div class="input-group">
        <label for="password">🔒 Password</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
    </div>
    <button type="submit" class="submit-btn">Create Account</button>
    <p class="switch-link">
        Already a member? <a href="login.html">Log In</a>
    </p>
</form>
<!-- ...existing code... -->
<script >
document.querySelector('.auth-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const name = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('http://localhost:5000/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name, password }) // No role sent
    });

    const data = await res.json();
    if (res.ok) {
        alert('Signup successful!');
        localStorage.setItem('token', data.token);
        window.location.href = 'index.html';
    } else {
        alert(data.message || 'Signup failed');
    }
});
</script>
