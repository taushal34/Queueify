<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Movie Ticket</title>
    <link rel="stylesheet" href="booking_btn_one.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="asesets/image/logoo.png" alt="Queueify Logo" class="logo-img">
            </a>
        </div>
        <div class="manu_bar">
            <ul>
                <li><a href="TRAIN_Tikit.html">FLITE/TRAIN Tikit</a></li>
                <li><a href="gov.html">GOVERNMENT WEBSITE</a></li>
                <li><a href="movie.html">MOVIE Tikit</a></li>
            </ul>
        </div>
        <div class="header-right">
            <button id="authBtn" class="submit-btn">Login</button>
        </div>
    </header>
    <div class="ticket_buy_img">
        <div class="content">
            <span>BOOK YOUR</span>
            <h2> MOVIE TICKET</h2>
            <form id="ticketForm" class="form" autocomplete="off">
                <label for="date">DATE</label>
                <input class="input_1" type="date" name="date" id="date" required>
                <label for="showTime">SHOW TIME</label>
                <select class="input_1" name="showTime" id="showTime" required>
                    <option value="">Select show time</option>
                    <option value="09:00 AM">09:00 AM</option>
                    <option value="11:30 AM">11:30 AM</option>
                    <option value="02:00 PM">02:00 PM</option>
                    <option value="04:30 PM">04:30 PM</option>
                    <option value="07:00 PM">07:00 PM</option>
                    <option value="09:30 PM">09:30 PM</option>
                    <option value="11:59 PM">11:59 PM</option>
                </select>
                <label for="ticketCount">HOW MANY TICKETS?</label>
                <select class="input_1" name="ticketCount" id="ticketCount" required>
                    <option value="">Select</option>
                    <option value="1">1 Ticket</option>
                    <option value="2">2 Tickets</option>
                    <option value="3">3 Tickets</option>
                </select>
                <button type="submit" class="BOOK_NOW">BOOK NOW</button>
            </form>
            <div id="ticketResult" style="margin-top:20px;font-weight:bold;color:#4caf50;"></div>
        </div>
        <div class="imgge">
            <img src="asesets/image/buy_ticect_train.png" alt="">
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // Set min date = today, max = today+30
        const dateInput = document.getElementById('date');
        const today = new Date();
        const minDate = today.toISOString().split('T')[0];
        const maxDate = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        dateInput.min = minDate;
        dateInput.max = maxDate;
        dateInput.value = minDate;

        // Auth button logic
        function updateAuthButton() {
            const btn = document.getElementById('authBtn');
            const token = localStorage.getItem('token');
            if (token) {
                btn.textContent = "Logout";
                btn.onclick = function () {
                    localStorage.removeItem('token');
                    window.location.href = 'logout.html';
                };
            } else {
                btn.textContent = "Login";
                btn.onclick = function () {
                    window.location.href = 'login.html';
                };
            }
        }
        updateAuthButton();

        // Only allow access if user is active for this subcategory
        const token = localStorage.getItem('token');
        const subcatId = localStorage.getItem('lastSubcatId');
        if (!token || !subcatId) {
            alert("Unauthorized access!");
            window.location.href = "index.html";
            return;
        }

        // Polling logic for status check
        function pollStatus() {
            fetch(`http://localhost:5000/api/register/queue-position/${subcatId}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "completed") {
                    alert("Your session is completed. Redirecting...");
                    window.location.href = "index.html";
                } else if (data.status !== "active") {
                    alert("You are not allowed to access this page now.");
                    window.location.href = "index.html";
                }
            });
        }
        pollStatus();
        setInterval(pollStatus, 3000);

        // Form submit logic
        document.getElementById('ticketForm').onsubmit = function (e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const subcategoryId = localStorage.getItem('lastSubcatId');
            const date = document.getElementById('date').value;
            const showTime = document.getElementById('showTime').value;
            const ticketCount = document.getElementById('ticketCount').value;

            if (!date || !showTime || !ticketCount) {
                document.getElementById('ticketResult').style.color = "#ff3333";
                document.getElementById('ticketResult').textContent = "Please fill all fields!";
                return;
            }

            fetch('http://localhost:5000/api/movie-ticket/book', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ subcategoryId, date, showTime, ticketCount })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('ticketResult').style.color = "#4caf50";
                    document.getElementById('ticketResult').innerHTML = `Your Ticket ID: <span style="color:#ff9800">${data.ticket_id}</span>`;
                } else {
                    document.getElementById('ticketResult').style.color = "#ff3333";
                    document.getElementById('ticketResult').textContent = data.message || "Booking failed!";
                }
            })
            .catch(() => {
                document.getElementById('ticketResult').style.color = "#ff3333";
                document.getElementById('ticketResult').textContent = "Something went wrong!";
            });
        };
    });
    </script>
</body>
</html>
