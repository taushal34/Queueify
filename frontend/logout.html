<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Queueify - Logout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <h2>You have been logged out.</h2>
        <button onclick="goToLogin()" class="submit-btn">Go to Login</button>
    </main>
    <script >
    // Remove token and redirect
    localStorage.removeItem('token');
    window.location.href = 'index.html'; // Redirect immediately to index.html
</script>
</body>
</html>
