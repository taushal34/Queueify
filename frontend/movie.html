    <script src="auth.js"></script>
    <script>
        let pollingInterval = null;
        let timerInterval = null;
        let isRegistering = false;

        function queueForMovie(subcategoryId, btnId) {
            if (isRegistering) return;
            isRegistering = true;
            const token = localStorage.getItem('token');
            if (!token) {
                alert("Please login first!");
                window.location.href = 'login.html';
                isRegistering = false;
                return;
            }
            fetch(`http://localhost:5000/api/register/${subcategoryId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(res => res.json())
            .then(data => {
                isRegistering = false;
                // Message div create or get
                let msgDiv = document.getElementById('queueMsg');
                if (!msgDiv) {
                    msgDiv = document.createElement('div');
                    msgDiv.id = 'queueMsg';
                    msgDiv.style.color = '#ff3333';
                    msgDiv.style.fontWeight = 'bold';
                    msgDiv.style.marginTop = '15px';
                    document.body.appendChild(msgDiv);
                }
                if (data && data.position) {
                    msgDiv.textContent = "";
                    alert(`You are registered in queue!\nYour position: ${data.position}\nStatus: waiting`);
                    startPollingStatus(subcategoryId, btnId);
                } else if (data && data.message) {
                    msgDiv.textContent = data.message;
                } else {
                    msgDiv.textContent = "Registration failed!";
                }
            })
            .catch(() => {
                isRegistering = false;
                let msgDiv = document.getElementById('queueMsg');
                if (!msgDiv) {
                    msgDiv = document.createElement('div');
                    msgDiv.id = 'queueMsg';
                    msgDiv.style.color = '#ff3333';
                    msgDiv.style.fontWeight = 'bold';
                    msgDiv.style.marginTop = '15px';
                    document.body.appendChild(msgDiv);
                }
                msgDiv.textContent = "Something went wrong!";
            });
        }

        function startPollingStatus(subcategoryId, btnId) {
            if (pollingInterval) clearInterval(pollingInterval);
            if (timerInterval) clearInterval(timerInterval);

            // Status & timer display elements
            let statusText = document.getElementById('queueStatusText');
            let timerText = document.getElementById('queueTimerText');
            if (!statusText) {
                statusText = document.createElement('div');
                statusText.id = 'queueStatusText';
                statusText.style.color = '#ffd61e';
                statusText.style.fontWeight = 'bold';
                statusText.style.marginTop = '10px';
                document.body.appendChild(statusText);
            }
            if (!timerText) {
                timerText = document.createElement('div');
                timerText.id = 'queueTimerText';
                timerText.style.color = '#ff9800';
                timerText.style.fontWeight = 'bold';
                timerText.style.marginTop = '5px';
                document.body.appendChild(timerText);
            }

            let phase = "waiting";
            let secondsLeft = 60;

            function updateTimer() {
                timerText.textContent = `Time left: ${secondsLeft} sec`;
                if (secondsLeft > 0) secondsLeft--;
                else clearInterval(timerInterval);
            }

            // Start timer for waiting phase
            timerInterval = setInterval(updateTimer, 1000);

            pollingInterval = setInterval(() => {
                const token = localStorage.getItem('token');
                fetch(`http://localhost:5000/api/register/queue-position/${subcategoryId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                })
                .then(res => res.json())
                .then(data => {
                    statusText.textContent = `Status: ${data.status}`;
                    if (data.status === "waiting" && phase !== "waiting") {
                        phase = "waiting";
                        secondsLeft = 60;
                        clearInterval(timerInterval);
                        timerInterval = setInterval(updateTimer, 1000);
                    }
                    if (data.status === "active" && phase !== "active") {
                        phase = "active";
                        secondsLeft = 60;
                        clearInterval(timerInterval);
                        timerInterval = setInterval(updateTimer, 1000);
                        clearInterval(pollingInterval);
                        showBookNowButton(btnId, subcategoryId);
                        setTimeout(() => {
                            alert("Your session is completed.");
                            window.location.href = "index.html";
                        }, 60 * 1000); // 1 min
                    }
                    if (data.status === "completed") {
                        clearInterval(pollingInterval);
                        clearInterval(timerInterval);
                        timerText.textContent = "";
                        alert("Your session is completed or already booked.");
                        window.location.href = "index.html";
                    }
                });
            }, 3000);
        }

        function showBookNowButton(btnId, subcategoryId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.textContent = "BOOK NOW";
                btn.onclick = function() {
                    localStorage.setItem('lastSubcatId', subcategoryId);
                    window.location.href = "movie_ticket.html";
                };
                btn.className = "BOOK_NOW";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const authBtn = document.getElementById('authBtn');
            const token = localStorage.getItem('token');
            if (authBtn) {
                if (token) {
                    authBtn.textContent = "Logout";
                    authBtn.onclick = function () {
                        localStorage.removeItem('token');
                        localStorage.removeItem('role');
                        window.location.href = 'logout.html';
                    };
                } else {
                    authBtn.textContent = "Login";
                    authBtn.onclick = function () {
                        window.location.href = 'login.html';
                    };
                }
            }
        });
    </script>
